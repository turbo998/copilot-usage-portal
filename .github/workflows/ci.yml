name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f api/requirements.txt ]; then
            pip install -r api/requirements.txt || echo "api/requirements.txt install failed; continuing with pytest only"
          fi

      - name: Run backend tests
        run: pytest tests/ -v
